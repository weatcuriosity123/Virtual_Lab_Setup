services:
  api:
    build: .
    container_name: linux-lab-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SESSION_DB: /data/sessions.db
      SESSION_CONFIG_DIR: /etc/nginx/sessions
      PROXY_CONTAINER: linux-lab-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./nginx/sessions:/etc/nginx/sessions
    networks:
      - linux-lab-net
    depends_on:
      - proxy
    mem_limit: 256m

  proxy:
    image: nginx:alpine
    container_name: linux-lab-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/sessions:/etc/nginx/sessions:ro
    networks:
      - linux-lab-net
    mem_limit: 128m

networks:
  linux-lab-net:
    name: linux-lab-net
    driver: bridge
